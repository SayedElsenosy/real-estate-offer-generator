name: Cloudflare migration build verification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [cloudflare-workers-migration, fix/cloudflare-1102-studio]
    paths:
      - 'package.json'
      - 'vite.config.ts'
      - 'wrangler.jsonc'
      - '.github/workflows/cloudflare-compatibility.yml'
      - 'src/**'
      - 'prisma/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install application dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Generate Prisma client
        run: npx prisma generate
      - name: TypeScript check
        run: npm run typecheck
      - name: vinext compatibility report
        run: npx vinext check
      - name: Build Cloudflare Worker (not deploy)
        run: npm run build:cloudflare
      - name: Verify generated Worker configuration
        run: test -f dist/worker/index.js || test -d dist
